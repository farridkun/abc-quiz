# Netlify only serves the static frontend (public/). The game API runs on the
# Cloudflare Worker configured in wrangler.toml; headers live in public/_headers.
[build]
  publish = "public"
  command = "npm run test:unit"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200
